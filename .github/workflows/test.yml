name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install streamdecker dependencies
        working-directory: streamdecker
        run: bun install

      - name: Typecheck
        working-directory: streamdecker
        run: bun run typecheck

      - name: Run unit tests
        working-directory: streamdecker
        run: bun test
